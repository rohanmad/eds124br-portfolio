<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDS124BR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#top">EDS124BR</a>
      <nav>
        <a href="#projects">Projects</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <p class="hero-brand">EDS124BR</p>
        <h1>Class projects, simply shared.</h1>
        <p class="hero-lede">
          A quiet home for coursework from EDS124BR — starting with one film.
        </p>
        <a class="cta" href="#projects">View projects</a>
      </section>

      <section class="projects" id="projects">
        <div class="projects-intro">
          <h2>Class projects</h2>
          <p>Featured work from the term.</p>
        </div>

        <article class="project">
          <h3>Featured project</h3>
          <p class="project-note">
            Watch the project film below.
          </p>
          <div class="video-wrap">
            <iframe
              src="https://www.youtube.com/embed/OmVt8saG8L8"
              title="EDS124BR class project video"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>EDS124BR</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
